name: ${COMPOSE_PROJECT_NAME}

services:
  # ── 1. Spring Boot Application ──────────────────────────────────────────────
  app:
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    # This maps 'host.docker.internal' to your VM's IP address
    ports:
      # Map host VM port to container port 8080
      - "${HOST_PORT}:${CONTAINER_PORT}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # General Config
      - SPRING_APPLICATION_NAME=${SPRING_APPLICATION_NAME}
      - SERVER_SERVLET_CONTEXT_PATH=${SERVER_SERVLET_CONTEXT_PATH}
      - APP_LOGGING_VERBOSE=${APP_LOGGING_VERBOSE}

      # PostgreSQL Database Config (Connecting to host VM on port 5432)
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO}
      # - SPRING_JPA_SHOW_SQL=true
      # - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_JPA_SHOW_SQL=${SPRING_JPA_SHOW_SQL}
      - SPRING_JPA_OPEN_IN_VIEW=${SPRING_JPA_OPEN_IN_VIEW}

      # Redis Config (Connecting to host VM on port 6380)
      - SPRING_DATA_REDIS_HOST=${SPRING_DATA_REDIS_HOST}
      - SPRING_DATA_REDIS_PORT=${SPRING_DATA_REDIS_PORT}
      - SPRING_DATA_REDIS_PASSWORD=${SPRING_DATA_REDIS_PASSWORD}
      - SPRING_DATA_REDIS_DATABASE=${SPRING_DATA_REDIS_DATABASE}
      # - SPRING_DATA_REDIS_DATABASE=0

      # Mail SMTP Config
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH}
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE}
      - SPRING_MAIL_PROPERTIES_MAIL_TRANSPORT_PROTOCOL=${SPRING_MAIL_PROPERTIES_MAIL_TRANSPORT_PROTOCOL}
      # - SPRING_MAIL_PROPERTIES_MAIL_DEBUG=true
      - SPRING_MAIL_PROPERTIES_MAIL_DEBUG=${SPRING_MAIL_PROPERTIES_MAIL_DEBUG}

      # Security & JWT
      - APPLICATION_SECURITY_JWT_SECRET_KEY=${APPLICATION_SECURITY_JWT_SECRET_KEY}
      - APPLICATION_SECURITY_JWT_EXPIRATION=${APPLICATION_SECURITY_JWT_EXPIRATION}
      - APP_SESSION_TIMEOUT_SECONDS=${APP_SESSION_TIMEOUT_SECONDS}

      # Rate Limits
      - APP_API_RATE_LIMIT_MAX_REQUESTS=${APP_API_RATE_LIMIT_MAX_REQUESTS}
      - APP_API_RATE_LIMIT_TIME_FRAME_MINUTES=${APP_API_RATE_LIMIT_TIME_FRAME_MINUTES}
      - APP_OTP_MAX_REQUESTS=${APP_OTP_MAX_REQUESTS}
      - APP_OTP_TIME_FRAME_MINUTES=${APP_OTP_TIME_FRAME_MINUTES}

      # Admin Seeder
      - APP_ADMIN_USERNAME=${APP_ADMIN_USERNAME}
      - APP_ADMIN_EMAIL=${APP_ADMIN_EMAIL}
      - APP_ADMIN_PASSWORD=${APP_ADMIN_PASSWORD}

